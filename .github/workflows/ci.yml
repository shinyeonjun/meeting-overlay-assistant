name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Windows 스모크는 수동으로만 돌린다(Actions 탭 > Run workflow).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    name: Server tests (PostgreSQL + pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      POSTGRESQL_DSN: postgresql://postgres:postgres@localhost:5432/caps
      TEST_POSTGRESQL_DSN: postgresql://postgres:postgres@localhost:5432/caps_test
      TEST_POSTGRESQL_ADMIN_DB: postgres
      # 유닛 테스트가 HF 모델을 몰래 내려받지 않도록 막는다.
      HF_HUB_OFFLINE: "1"

    steps:
      - uses: actions/checkout@v5

      - name: Install system audio library
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-app.txt
            requirements-dev.txt

      - name: Check uv.lock is in sync with pyproject.toml
        run: |
          pip install uv
          uv lock --check

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (문법 오류와 미사용·미정의 이름)
        run: ruff check server tests

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          # tests/known_failures.txt: 아직 고치지 못한 테스트 목록 (README 참고)
          deselect=()
          while IFS= read -r node; do
            [[ -z "$node" || "$node" == \#* ]] && continue
            deselect+=(--deselect "$node")
          done < tests/known_failures.txt
          pytest -q -rfE "${deselect[@]}" 2>&1 | tee pytest.log

      - name: Report test result
        if: always()
        shell: bash
        run: echo "::notice title=pytest::$(tail -n 1 pytest.log | sed 's/%/%25/g')"

      - name: Surface test failures
        if: failure()
        shell: bash
        run: |
          echo "::error title=pytest result::$(tail -n 1 pytest.log | sed 's/%/%25/g')"
          failed=$(grep -E "^(FAILED|ERROR) " pytest.log | sed -E 's/^(FAILED|ERROR) tests\/[^:]*::[^:]*::/\1 /' | cut -c1-230 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=pytest failed tests::${failed}"

  client-tests:
    name: Overlay client tests (node)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/overlay/package-lock.json

      - name: Install dependencies
        working-directory: client/overlay
        run: npm ci

      - name: Run node tests
        working-directory: client/overlay
        run: npm test

  windows-smoke:
    name: Windows smoke (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # DB가 필요 없는 테스트만 돌린다. 경로·프로세스·Windows 전용 가정을 확인하는 용도다.
      - name: Run platform-independent tests
        shell: bash
        run: |
          pytest -q             tests/server/platform/test_context_boundaries.py             tests/server/platform/test_runtime_security.py             tests/server/platform/test_websocket_auth_token.py             tests/server/platform/test_job_claim_fence.py             tests/server/platform/test_job_lease_heartbeat.py             tests/server/audio/test_ryzenai_runtime.py             tests/server/audio/test_speech_to_text_factory.py
