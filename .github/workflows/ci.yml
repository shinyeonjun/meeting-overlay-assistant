name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    name: Server tests (PostgreSQL + pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      POSTGRESQL_DSN: postgresql://postgres:postgres@localhost:5432/caps
      TEST_POSTGRESQL_DSN: postgresql://postgres:postgres@localhost:5432/caps_test
      TEST_POSTGRESQL_ADMIN_DB: postgres

    steps:
      - uses: actions/checkout@v5

      - name: Install system audio library
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-app.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          pytest -q -rfE 2>&1 | tee pytest.log

      - name: Surface test failures
        if: failure()
        shell: bash
        run: |
          summary=$(grep -E "^(FAILED|ERROR) |passed|failed|error" pytest.log | tail -n 80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=pytest summary::${summary}"
