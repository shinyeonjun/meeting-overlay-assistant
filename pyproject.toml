[project]
name = "meeting-overlay-assistant"
version = "0.1.0"
description = "사내 설치형 회의 보조 및 문서화 시스템 백엔드"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "websockets>=14.0.0,<15.0.0",
    "numpy>=2.3.0,<3.0.0",
    "transformers>=4.45.0,<6.0.0",
    "huggingface_hub>=0.30.0,<2.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "sounddevice>=0.5.0,<1.0.0",
    "soundcard>=0.4.3,<1.0.0",
    "faster-whisper>=1.1.0,<2.0.0",
    "sherpa-onnx>=1.12.10,<2.0.0",
    "psutil>=6.0.0,<7.0.0",
    "reportlab>=4.0.0,<5.0.0",
    "rich>=13.9.0,<14.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "psycopg-pool>=3.2.0,<4.0.0",
    "alembic>=1.13.0,<2.0.0",
    "redis>=5.2.0,<6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "httpx>=0.28.0,<1.0.0",
    "soundfile>=0.12.0,<1.0.0",
    "scipy>=1.14.0,<2.0.0",
]
# 회색 자막 Nemotron용. torch CUDA 빌드는 requirements-nemotron.txt의 PyTorch 인덱스로 설치한다.
nemotron = [
    "torch>=2.11.0",
    "accelerate>=1.0.0,<2.0.0",
    "librosa>=0.10.0,<2.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# 1차 도입: 문법 오류와 미사용·미정의 이름만 막는다. 스타일 규칙은 정리 후에 켠다.
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# 패키지 공개 API와 DI 재노출 모듈은 import를 의도적으로 모아 둔다.
"**/__init__.py" = ["F401"]
"server/app/api/http/dependencies.py" = ["F401"]
# 다른 모듈이 config에서 ROOT_DIR, ENV_PATH를 가져다 쓰는 공개 경로다.
"server/app/core/config.py" = ["F401"]
# 호환 facade: 기존 import 경로와 테스트 monkeypatch가 이 이름들을 쓴다.
"server/app/api/http/routes/reports.py" = ["F401"]
